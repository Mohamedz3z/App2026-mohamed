<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" fill="none" role="img" aria-label="شعار أثر للتدريب الإبداعي">
  <!-- Creative Leaf / Impact Emblem -->
  <g transform="translate(10, 10)">
    <!-- Rounded Background Glow -->
    <rect width="60" height="60" rx="16" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1.5" />
    <!-- Dynamic Creative Curves: Orange & Green Path -->
    <path d="M40 18 C30 18, 20 28, 20 40 C20 45, 24 50, 30 50 C42 50, 50 38, 50 24 C50 20, 45 18, 40 18 Z" fill="#C2410C" />
    <path d="M26 36 C28 26, 36 20, 44 20 C42 28, 36 36, 26 36 Z" fill="#15803D" opacity="0.9" />
    <!-- Impact Sparkle -->
    <circle cx="44" cy="22" r="3.5" fill="#F59E0B" />
    <circle cx="23" cy="42" r="2.5" fill="#F97316" />
  </g>

  <!-- Typography: Athar -->
  <text x="82" y="44" font-family="'Cairo', 'Segoe UI', sans-serif" font-size="28" font-weight="800" fill="#111827">أَثَـر</text>
  <text x="135" y="42" font-family="'Cairo', 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#C2410C">للـتدريـب</text>
  <text x="82" y="64" font-family="'Cairo', 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#15803D" letter-spacing="0.5">الإبـداعـي</text>
</svg>
