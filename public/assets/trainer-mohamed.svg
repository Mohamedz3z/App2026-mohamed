<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none" role="img" aria-label="المدرب محمد سيف الدين - مؤسس أثر للتدريب الإبداعي">
  <!-- Subtle Gradient Background -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF7ED" />
      <stop offset="60%" stop-color="#FDFBF7" />
      <stop offset="100%" stop-color="#ECFDF5" />
    </linearGradient>
    <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C2410C" />
      <stop offset="50%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1E293B" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="400" height="400" rx="32" fill="url(#bg-grad)" />
  
  <!-- Outer Accent Decorative Rings -->
  <circle cx="200" cy="180" r="130" stroke="url(#ring-grad)" stroke-width="4" stroke-dasharray="12 8" opacity="0.6" />
  <circle cx="200" cy="180" r="115" fill="#FFFFFF" filter="url(#card-shadow)" />

  <!-- Trainer Professional Silhouette/Emblem -->
  <g transform="translate(200, 180)">
    <!-- Base Glow -->
    <circle cx="0" cy="0" r="110" fill="#F8FAFC" />
    
    <!-- Professional Suit & Shoulders -->
    <path d="M-68 85 C-68 45, -45 28, 0 28 C45 28, 68 45, 68 85 Z" fill="#1E293B" />
    <!-- Shirt Collar (V-neck) -->
    <path d="M-22 28 L0 58 L22 28 Z" fill="#FFFFFF" />
    <!-- Tie / Accent (Creative Orange) -->
    <path d="M-6 42 L6 42 L9 78 L0 88 L-9 78 Z" fill="#C2410C" />
    
    <!-- Head & Hair -->
    <ellipse cx="0" cy="-22" rx="34" ry="42" fill="#E2E8F0" />
    <!-- Hair & Beard Styling Silhouette -->
    <path d="M-34 -30 C-32 -60, 32 -60, 34 -30 C35 -15, 34 -5, 32 0 C24 -15, -24 -15, -32 0 C-34 -5, -35 -15, -34 -30 Z" fill="#1E293B" />
    <!-- Friendly Glasses Silhouette -->
    <rect x="-26" y="-24" width="20" height="13" rx="4" fill="none" stroke="#0F172A" stroke-width="3" />
    <rect x="6" y="-24" width="20" height="13" rx="4" fill="none" stroke="#0F172A" stroke-width="3" />
    <path d="M-6 -18 L6 -18" stroke="#0F172A" stroke-width="3" />
    <!-- Friendly Smile -->
    <path d="M-10 -2 Q0 6 10 -2" fill="none" stroke="#475569" stroke-width="2.5" stroke-linecap="round" />
    <!-- Neat Beard Outline -->
    <path d="M-24 -4 C-20 20, 20 20, 24 -4 C20 12, -20 12, -24 -4 Z" fill="#334155" opacity="0.85" />
  </g>

  <!-- Sparkle of Creativity -->
  <g transform="translate(300, 90)">
    <path d="M0 -14 L3 -3 L14 0 L3 3 L0 14 L-3 3 L-14 0 L-3 -3 Z" fill="#F59E0B" />
  </g>
  <g transform="translate(90, 250)">
    <path d="M0 -10 L2 -2 L10 0 L2 2 L0 10 L-2 2 L-10 0 L-2 -2 Z" fill="#15803D" />
  </g>

  <!-- Professional Badge Pill at the bottom -->
  <g transform="translate(200, 340)">
    <rect x="-140" y="-20" width="280" height="42" rx="21" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#card-shadow)" />
    <!-- Athar leaf indicator -->
    <circle cx="-110" cy="1" r="7" fill="#C2410C" />
    <circle cx="-110" cy="1" r="3.5" fill="#15803D" />
    <text x="-95" y="6" font-family="'Cairo', 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#111827">المدرب محمد سيف الدين</text>
  </g>
</svg>
